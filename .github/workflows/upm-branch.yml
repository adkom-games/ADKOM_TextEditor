name: Sync upm branch

# Regenerates the package-only 'upm' branch (root = Packages/com.adkom.text-editor)
# whenever the package changes on main. UPM installs point at #upm so consumers
# don't clone the whole Unity project. Release tags point at upm-branch commits
# (created with the GitHub Release for each version).
on:
  push:
    branches: [main]
    paths:
      - 'Packages/com.adkom.text-editor/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Editor-guard check (no code may leak into user builds)
        shell: pwsh
        run: ./Tools/check-editor-guards.ps1
      - name: Localization completeness check
        shell: pwsh
        run: ./Tools/check-l10n.ps1
      # Verification needs only the PUBLIC key (Tools/adkom-signing-key.pub);
      # the signing key never leaves the maintainer's machine.
      - name: Shipped sample signatures (must match current content)
        shell: pwsh
        run: ./Tools/check-sample-signatures.ps1
      - name: Split package subtrees and push
        run: |
          git subtree split --prefix=Packages/com.adkom.text-editor -b upm
          git push -f origin upm
